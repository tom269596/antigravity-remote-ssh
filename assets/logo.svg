<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- 10% empty margin (canvas 128x128, frame 104x104 from 12,12) -->
  <rect x="14" y="14" width="100" height="100" rx="20" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8"/>
  
  <!-- Terminal Header Dots -->
  <circle cx="28" cy="28" r="3.5" fill="#ef4444"/>
  <circle cx="38" cy="28" r="3.5" fill="#f59e0b"/>
  <circle cx="48" cy="28" r="3.5" fill="#10b981"/>
  
  <!-- Header separator line -->
  <line x1="14" y1="38" x2="114" y2="38" stroke="#334155" stroke-width="2"/>
  
  <!-- Terminal Prompt & SSH symbol -->
  <path d="M 28 54 L 38 62 L 28 70" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="44" y1="70" x2="56" y2="70" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Server Rack / Remote Key graphics -->
  <rect x="66" y="50" width="40" height="18" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <circle cx="74" cy="59" r="2.5" fill="#38bdf8"/>
  <line x1="82" y1="59" x2="98" y2="59" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

  <rect x="66" y="74" width="40" height="18" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <circle cx="74" cy="83" r="2.5" fill="#10b981"/>
  <line x1="82" y1="83" x2="98" y2="83" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Connecting bridge line -->
  <path d="M 46 84 C 54 84 58 83 66 83" fill="none" stroke="url(#serverGrad)" stroke-width="2" stroke-dasharray="3 3"/>
</svg>
